name: Publish UX Job Plan

on:
  push:
    branches: [main]
  schedule:
    - cron: "33 10 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refresh public updates
        run: python3 scripts/refresh_updates.py ux-job-plan/data/updates.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ux-job-plan

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

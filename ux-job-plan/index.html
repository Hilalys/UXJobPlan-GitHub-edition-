<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UX Job Plan</title>
<meta name="description" content="A weekly plan, skills tracker and job-search toolkit for UX and product designers.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { var s = JSON.parse(localStorage.getItem("uxjp:settings") || "{}"); if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="nav-toggle" type="button" aria-label="Open menu" aria-controls="side" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="brand" href="#overview" aria-label="UX Job Plan, overview"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 9 21h6z"/><path d="M6.5 8.5h11"/><path d="M8 5.5h8"/></svg></span></a>
    <span class="t-title" id="top-title" aria-live="polite"></span>
  </header>
  <aside class="side" id="side" aria-label="Main menu">
    <a class="brand" href="#overview"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 9 21h6z"/><path d="M6.5 8.5h11"/><path d="M8 5.5h8"/></svg></span><span class="brand-text"><b>UX Job Plan</b><span class="brand-sub" id="brand-sub">Product design</span></span></a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot nav">
      <a href="#tool-settings" data-route="tool-settings" id="nav-settings"></a>
      <div class="sync" id="sync" data-s="loading" role="status"><i aria-hidden="true"></i><span>Loading…</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <main class="main" id="main" tabindex="-1">
    <div class="loading"><div class="spinner" aria-hidden="true"></div><p>Loading your plan…</p></div>
  </main>
</div>
<div class="timerbar" id="timerbar" hidden role="region" aria-label="Stopwatch"></div>
<div id="sheet-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
